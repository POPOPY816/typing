<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-になります。これで理不尽なループは発生しなくなります。
*   **アニメーションの改善 (おまけ)**: 以前のコードだと8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>エンドレス1文字タイピング</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-、連続してミスをしたときに `className` がすでに `wrong` になっているため、2回目以降のミスで画面が震えませんでした。`void targetElement.items: center;
    height: 100vh;
    margin: 0;
    background-color: #282c34;
offsetWidth;` を挟むことでブラウザに再描画を促し、何度連続で間違えても毎回ちゃんとエラーのアニメーションが再生されるように    color: #ffffff;
    font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
    overflow: hidden;
調整しています。  }

  #score-board {
    font-size: 24px;
    color: #61dafb;
    margin-bottom: 20px;
  }

  #target-container {
    width: 300px;
    height: 300px;
    display: grid;
    place-items: center;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 20px;
  }

  #target {
    font-size: 180px;
    font-weight: bold;
    line-height: 0;
    transition: color 0.1s;
    user-select: none;
  }

  .correct { color: #4caf50 !important; }
  .wrong {
    color: #f44336 !important;
    animation: shake 0.2s ease-in-out;
  }

  @keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-15px); }
    50% { transform: translateX(15px); }
    75% { transform: translateX(-15px); }
    100% { transform: translateX(0); }
  }

  #note {
    margin-top: 30px;
    color: #888;
    font-size: 14px;
    text-align: center;
  }
</style>
</head>
<body>

  <div id="score-board">スコア: <span id="score">0</span></div>
  
  <div id="target-container">
    <div id="target">-</div>
  </div>

  <div id="note">
    ※半角英数モードで入力<br>
    （ミスした文字は5個後に再出現）
  </div>

<script>
  const targets = [
    ...Array.from("ABCDEFGHIJKLMNOPQRSTUVWXYZ").map(char => ({ display: char, key: char })),
    { display: ",", key: "," },
    { display: ".", key: "." },
    { display: "/", key: "/" },
    { display: "-", key: "-" }
  ];

  let currentTarget = null;
  let score = 0;
  let futureQueue = [];
  const REAPPEAR_INDEX = 4;

  // 追加: ループ防止用の変数
  let hasMissedCurrent = false; 
  let lastGeneratedKey = "";

  const targetElement = document.getElementById("target");
  const scoreElement = document.getElementById("score");

  function getRandomTarget() {
    let newTarget;
    // 追加: 直前に生成した文字と被らないように再抽選する
    do {
      newTarget = targets[Math.floor(Math.random() * targets.length)];
    } while (newTarget.key === lastGeneratedKey);
    
    lastGeneratedKey = newTarget.key;
    return newTarget;
  }

  function initQueue() {
    for (let i = 0; i < 10; i++) {
      futureQueue.push(getRandomTarget());
    }
  }

  function setNextLetter() {
    currentTarget = futureQueue.shift();
    futureQueue.push(getRandomTarget());
    targetElement.textContent = currentTarget.display;
    targetElement.className = "";
    
    // 追加: 新しい文字に切り替わったらミス判定をリセット
    hasMissedCurrent = false; 
  }

  document.addEventListener("keydown", (event) => {
    if (event.isComposing) return;

    const inputKey = event.key.toUpperCase();
    if (["SHIFT", "CONTROL", "ALT", "META", "ENTER", "BACKSPACE", "TAB", "ESCAPE"].includes(inputKey)) return;

    if (inputKey === currentTarget.key.toUpperCase()) {
      score++;
      scoreElement.textContent = score;
      targetElement.className = "correct";
      setTimeout(setNextLetter, 50);
    } else {
      targetElement.className = "wrong";
      
      // 追加: まだこの文字でミス処理をしていない場合のみキューに追加する
      if (!hasMissedCurrent) {
        futureQueue.splice(REAPPEAR_INDEX, 0, currentTarget);
        hasMissedCurrent = true; // フラグを立てて連打による増殖を防ぐ
      }
      
      setTimeout(() => {
        targetElement.className = "";
      }, 200);
    }
  });

  initQueue();
  setNextLetter();
</script>
</body>
</html>
