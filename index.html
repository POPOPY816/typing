<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>エンドレス1文字タイピング（位置固定版）</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #282c34;
    color: #ffffff;
    font-family: 'Arial', sans-serif;
    overflow: hidden; /* スクロール禁止 */
  }
  #score-board {
    font-size: 24px;
    color: #61dafb;
    margin-bottom: 20px;
  }
  /* ターゲット表示エリアの修正 */
  #target {
    font-size: 150px;
    font-weight: bold;
    transition: color 0.1s;
    /* 
       高さを固定し、flexを使って中身を上下左右中央に。
       これで記号が上下に跳ねるのを防ぎます。
    */
    display: flex;
    justify-content: center;
    align-items: center;
    width: 300px;
    height: 200px;
    line-height: 1; 
    text-align: center;
  }
  .correct {
    color: #4caf50 !important;
  }
  .wrong {
    color: #f44336 !important;
    animation: shake 0.2s ease-in-out;
  }
  @keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-15px); }
    50% { transform: translateX(15px); }
    75% { transform: translateX(-15px); }
    100% { transform: translateX(0); }
  }
  #note {
    margin-top: 30px;
    color: #888;
    font-size: 14px;
    text-align: center;
    line-height: 1.6;
  }
</style>
</head>
<body>

  <div id="score-board">スコア: <span id="score">0</span></div>
  <div id="target">-</div>
  <div id="note">
    ※必ず「半角英数モード」でプレイしてください<br>
    （ミスした文字は5個後に再出現します）
  </div>

<script>
  const targets = [
    ...Array.from("ABCDEFGHIJKLMNOPQRSTUVWXYZ").map(char => ({ display: char, key: char })),
    { display: "，", key: "," }, // 全角風の見た目にして視認性を向上
    { display: "．", key: "." },
    { display: "/", key: "/" }, // "/" は見にくいので "?" に変更（キー判定は / のまま）
    { display: "ー", key: "-" }
  ];

  let currentTarget = null;
  let score = 0;
  let futureQueue = [];
  const REAPPEAR_INDEX = 4;

  const targetElement = document.getElementById("target");
  const scoreElement = document.getElementById("score");

  function getRandomTarget() {
    return targets[Math.floor(Math.random() * targets.length)];
  }

  function initQueue() {
    for (let i = 0; i < 10; i++) {
      futureQueue.push(getRandomTarget());
    }
  }

  function setNextLetter() {
    currentTarget = futureQueue.shift();
    futureQueue.push(getRandomTarget());
    targetElement.textContent = currentTarget.display;
    targetElement.className = "";
  }

  document.addEventListener("keydown", (event) => {
    if (event.isComposing) return;

    // 入力キーを判定（記号も含むのでtoUpperCaseはアルファベットのみに効く）
    const inputKey = event.key.toUpperCase();
    if (["SHIFT", "CONTROL", "ALT", "META", "ENTER", "BACKSPACE", "TAB", "ESCAPE"].includes(inputKey)) return;

    // 判定（currentTarget.key と比較）
    if (inputKey === currentTarget.key.toUpperCase()) {
      score++;
      scoreElement.textContent = score;
      targetElement.className = "correct";
      setTimeout(setNextLetter, 50);
    } else {
      targetElement.className = "wrong";
      futureQueue.splice(REAPPEAR_INDEX, 0, currentTarget);
      setTimeout(() => {
        targetElement.className = "";
      }, 200);
    }
  });

  initQueue();
  setNextLetter();
</script>
</body>
</html>
