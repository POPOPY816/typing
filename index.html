<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>エンドレス1文字タイピング</title>
<style>
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #282c34;
    color: #ffffff;
    font-family: 'Consolas', 'Monaco', 'Courier New', monospace; /* 等幅フォントでサイズを安定化 */
    overflow: hidden;
  }

  #score-board {
    font-size: 24px;
    color: #61dafb;
    margin-bottom: 20px;
  }

  /* センター配置のコア設定 */
  #target-container {
    width: 300px;
    height: 300px;
    display: grid; /* Gridを使用 */
    place-items: center; /* 上下左右を完全に中央揃え */
    background: rgba(255, 255, 255, 0.05); /* センターが分かりやすいよう薄く背景 */
    border-radius: 20px;
  }

  #target {
    font-size: 180px; /* 少し大きく */
    font-weight: bold;
    line-height: 0; /* 行間をゼロにして文字本来の浮き上がりを抑制 */
    transition: color 0.1s;
    user-select: none;
  }

  .correct { color: #4caf50 !important; }
  .wrong {
    color: #f44336 !important;
    animation: shake 0.2s ease-in-out;
  }

  @keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-15px); }
    50% { transform: translateX(15px); }
    75% { transform: translateX(-15px); }
    100% { transform: translateX(0); }
  }

  #note {
    margin-top: 30px;
    color: #888;
    font-size: 14px;
    text-align: center;
  }
</style>
</head>
<body>

  <div id="score-board">スコア: <span id="score">0</span></div>
  
  <!-- コンテナを追加して位置を絶対化 -->
  <div id="target-container">
    <div id="target">-</div>
  </div>

  <div id="note">
    ※半角英数モードで入力<br>
    （ミスした文字は5個後に再出現）
  </div>

<script>
  // 記号もそのままの文字を使って大丈夫なように調整
  const targets = [
    ...Array.from("ABCDEFGHIJKLMNOPQRSTUVWXYZ").map(char => ({ display: char, key: char })),
    { display: ",", key: "," },
    { display: ".", key: "." },
    { display: "/", key: "/" },
    { display: "-", key: "-" }
  ];

  let currentTarget = null;
  let score = 0;
  let futureQueue = [];
  const REAPPEAR_INDEX = 4;

  const targetElement = document.getElementById("target");
  const scoreElement = document.getElementById("score");

  function getRandomTarget() {
    return targets[Math.floor(Math.random() * targets.length)];
  }

  function initQueue() {
    for (let i = 0; i < 10; i++) {
      futureQueue.push(getRandomTarget());
    }
  }

  function setNextLetter() {
    currentTarget = futureQueue.shift();
    futureQueue.push(getRandomTarget());
    targetElement.textContent = currentTarget.display;
    targetElement.className = "";
  }

  document.addEventListener("keydown", (event) => {
    if (event.isComposing) return;

    const inputKey = event.key.toUpperCase();
    if (["SHIFT", "CONTROL", "ALT", "META", "ENTER", "BACKSPACE", "TAB", "ESCAPE"].includes(inputKey)) return;

    // アルファベットと記号の両方に対応する判定
    if (inputKey === currentTarget.key.toUpperCase()) {
      score++;
      scoreElement.textContent = score;
      targetElement.className = "correct";
      setTimeout(setNextLetter, 50);
    } else {
      targetElement.className = "wrong";
      futureQueue.splice(REAPPEAR_INDEX, 0, currentTarget);
      setTimeout(() => {
        targetElement.className = "";
      }, 200);
    }
  });

  initQueue();
  setNextLetter();
</script>
</body>
</html>
