<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>エンドレス1文字タイピング</title>
<style>
  /* 元のCSSから変更なし */
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #282c34;
    color: #ffffff;
    font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
    overflow: hidden;
  }

  #score-board {
    font-size: 24px;
    color: #61dafb;
    margin-bottom: 20px;
  }

  #target-container {
    width: 300px;
    height: 300px;
    display: grid;
    place-items: center;
    background: rgba(255, 255, 255, 0.05);
    border-radius: 20px;
  }

  #target {
    font-size: 180px;
    font-weight: bold;
    line-height: 1;
    user-select: none;
    transition: color 0.1s;
  }

  .wrong #target {
    color: #f44336 !important;
    animation: shake 0.2s ease-in-out;
  }

  @keyframes shake {
    0% { transform: translateX(0); }
    25% { transform: translateX(-15px); }
    50% { transform: translateX(15px); }
    75% { transform: translateX(-15px); }
    100% { transform: translateX(0); }
  }

  #note {
    margin-top: 30px;
    color: #888;
    font-size: 14px;
    text-align: center;
  }
</style>
</head>
<body>

  <div id="score-board">スコア: <span id="score">0</span></div>
  
  <div id="target-container">
    <div id="target">-</div>
  </div>

  <div id="note">
    ※半角英数モードで入力<br>
    （ミスした文字は5個後に再出現）
  </div>

<script>
  // 改善点2: 出題リストをまとめて生成するように変更
  const TARGET_CHARS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ,./-";
  const targets = Array.from(TARGET_CHARS).map(char => ({ display: char, key: char }));

  let currentTarget = null;
  let score = 0;
  let futureQueue = [];
  const REAPPEAR_INDEX = 4;

  let hasMissedCurrent = false; 
  let lastGeneratedKey = "";

  const targetContainer = document.getElementById("target-container");
  const targetElement = document.getElementById("target");
  const scoreElement = document.getElementById("score");

  function getRandomTarget() {
    let newTarget;
    do {
      newTarget = targets[Math.floor(Math.random() * targets.length)];
    } while (newTarget.key === lastGeneratedKey);
    
    lastGeneratedKey = newTarget.key;
    return newTarget;
  }

  function initQueue() {
    for (let i = 0; i < 10; i++) {
      futureQueue.push(getRandomTarget());
    }
  }

  function setNextLetter() {
    currentTarget = futureQueue.shift();
    futureQueue.push(getRandomTarget());
    targetElement.textContent = currentTarget.display;
    
    // 状態リセット
    targetContainer.classList.remove("wrong");
    hasMissedCurrent = false; 
  }

  document.addEventListener("keydown", (event) => {
    if (event.isComposing) return;

    // 改善点1: event.keyが1文字でない場合（修飾キー、特殊キーなど）は無視する
    if (event.key.length !== 1) return;

    const inputKey = event.key.toUpperCase();

    if (inputKey === currentTarget.key) {
      // 正解
      score++;
      scoreElement.textContent = score;
      setNextLetter();
    } else {
      // 不正解
      targetContainer.classList.remove("wrong");
      void targetContainer.offsetWidth; 
      targetContainer.classList.add("wrong");
      
      if (!hasMissedCurrent) {
        futureQueue.splice(REAPPEAR_INDEX, 0, currentTarget);
        hasMissedCurrent = true;
      }
    }
  });

  initQueue();
  setNextLetter();
</script>
</body>
</html>
